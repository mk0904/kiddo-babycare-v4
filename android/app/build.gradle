apply plugin: 'com.google.gms.google-services'

// Disable lint vital analyze for release to avoid Metaspace OOM in lint worker
tasks.configureEach { task ->
    if (task.name.matches(/lintVitalAnalyzeRelease.*/)) {
        task.enabled = false
    }
}
